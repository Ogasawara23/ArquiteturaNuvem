name: cd
# Publica as imagens no Docker Hub a cada tag v*. Segredos: DOCKERHUB_USERNAME e DOCKERHUB_TOKEN.
on:
  push:
    tags: ['v*']
jobs:
  imagens:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { nome: catalogo-service, contexto: services/catalogo-service }
          - { nome: pedido-service, contexto: services/pedido-service }
          - { nome: producao-service, contexto: services/producao-service }
          - { nome: estabelecimento-service, contexto: services/estabelecimento-service }
          - { nome: api-gateway, contexto: gateway/api-gateway }
          - { nome: bff-mesa, contexto: bff/bff-mesa }
          - { nome: bff-kds, contexto: bff/bff-kds }
          - { nome: bff-admin, contexto: bff/bff-admin }
          - { nome: status-operacional-function, contexto: functions/status-operacional }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartkds-${{ matrix.nome }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/smartkds-${{ matrix.nome }}:latest
