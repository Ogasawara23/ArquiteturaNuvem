server {
    listen 80;
    root /usr/share/nginx/html;

    # remoteEntry.js e chunks sao carregados por outra origem (o shell): CORS liberado para leitura.
    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # SPA: /m/{qrToken} e demais rotas caem no index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
